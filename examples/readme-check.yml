name: fibcheck README check

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - README.md

permissions: {}

concurrency:
  group: fibcheck-readme-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  check:
    if: ${{ github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository }}
    # GitHub's free runner has Docker and Chrome. On a dedicated self-hosted runner,
    # pass env-file (an absolute path to a private .env outside the workspace) instead
    # of the key and sign-in inputs.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      report: ${{ steps.fibcheck.outputs.report }}
    steps:
      - name: Check public README
        id: fibcheck
        uses: Ololadestephen/fibcheck@84e612adaebd49c7ea7c0d162658930ba1bd778f # main on 2026-11-21
        with:
          target-file: .github/fibcheck.target.json
          max-claims: '3'
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          lt-username: ${{ secrets.LT_USERNAME }}
          lt-access-key: ${{ secrets.LT_ACCESS_KEY }}
          kane-project-id: ${{ vars.KANE_PROJECT_ID }}
          kane-folder-id: ${{ vars.KANE_FOLDER_ID }}

  comment:
    needs: check
    if: ${{ vars.FIBCHECK_PR_COMMENTS == 'true' && needs.check.outputs.report != '' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post the checked result counts
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FIBCHECK_REPORT: ${{ needs.check.outputs.report }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$FIBCHECK_REPORT"
